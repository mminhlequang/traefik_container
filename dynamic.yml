http:
  routers:

    # Fastship Routers

    fastship-customer:
      rule: "Host(`fastshiphu.com`) || HostRegexp(`^[a-z0-9-]+\\.fastshiphu\\.com$`)"
      # Keep exact admin/api Host routers ahead of this wildcard fallback.
      priority: 1
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt
        domains:
          - main: fastshiphu.com
            sans:
              - "*.fastshiphu.com"
      service: fastship-customer

    fastship-hu:
      rule: "Host(`fastship.hu`)"
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt-http
      service: fastship-customer

    fastship-hu-storefronts:
      rule: "HostRegexp(`^[a-z0-9-]+\\.fastship\\.hu$`)"
      priority: 1
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt
        domains:
          - main: "*.fastship.hu"
      service: fastship-customer

    fastship-admin:
      rule: "Host(`admin.fastshiphu.com`)"
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: fastship-admin

    fastship-api:
      rule: "Host(`api.fastshiphu.com`)"
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: fastship-api

    fastship-pos:
      rule: "Host(`pos.fastshiphu.com`)"
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: fastship-pos

    fastship-pos-staff:
      rule: "Host(`posstaff.fastshiphu.com`)"
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: fastship-pos-staff

    # Modriva Routers

    modriva-web:
      rule: "Host(`modriva.gmah.cloud`)"
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt-http
      service: modriva-web

    modriva-api:
      rule: "Host(`api.modriva.gmah.cloud`)"
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt-http
      service: modriva-api

  services:

    # Fastship Services

    fastship-customer:
      loadBalancer:
        servers:
          - url: "http://nextjs-customer:3000"

    fastship-admin:
      loadBalancer:
        servers:
          - url: "http://nextjs-admin:3001"

    fastship-api:
      loadBalancer:
        servers:
          - url: "http://backend_fastapi-backend-1:8000"

    fastship-pos:
      loadBalancer:
        servers:
          - url: "http://nextjs-pos:3004"

    fastship-pos-staff:
      loadBalancer:
        servers:
          - url: "http://nextjs-pos-staff:3005"

    # Modriva Services

    modriva-web:
      loadBalancer:
        servers:
          - url: "http://modriva-web:3000"

    modriva-api:
      loadBalancer:
        servers:
          - url: "http://modriva-api:8000"
